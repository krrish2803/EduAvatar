<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - EduAvatar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--clr-bg-main);
            overflow: hidden;
            position: relative;
        }
        
        /* Subtle background effects */
        body::before {
            content: '';
            position: absolute;
            top: -20%; left: -10%;
            width: 500px; height: 500px;
            background: var(--clr-accent);
            filter: blur(150px); opacity: 0.15;
            z-index: 0; pointer-events: none;
        }
        body::after {
            content: '';
            position: absolute;
            bottom: -20%; right: -10%;
            width: 500px; height: 500px;
            background: var(--clr-highlight);
            filter: blur(150px); opacity: 0.15;
            z-index: 0; pointer-events: none;
        }

        .auth-card {
            background: var(--clr-bg-card);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 3rem;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            z-index: 10;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            position: relative;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h2 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .auth-header p {
            font-size: 0.9rem;
            color: var(--clr-text-muted);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: var(--clr-text-muted);
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
        }

        .form-group input:focus {
            border-color: var(--clr-highlight);
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.2);
            background: rgba(255,255,255,0.05);
        }

        .auth-btn {
            width: 100%;
            margin-top: 1rem;
            padding: 14px;
            font-size: 1rem;
        }

        .toggle-text {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--clr-text-muted);
        }

        .toggle-text a {
            color: var(--clr-highlight);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .toggle-text a:hover {
            text-decoration: underline;
        }

        .back-link {
            position: absolute;
            top: 2rem;
            left: 2rem;
            color: var(--clr-text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
            transition: 0.2s;
            z-index: 10;
        }

        .back-link:hover {
            color: white;
        }
    </style>
</head>
<body>

    <a href="/index.html" class="back-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back to Home
    </a>

    <div class="auth-card">
        <div class="auth-header">
            <h2 id="auth-title">Welcome Back</h2>
            <p id="auth-subtitle">Sign in to continue to your dashboard</p>
        </div>

        <form id="auth-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="student@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="cta-btn primary-btn auth-btn" id="submit-btn">Sign In</button>
        </form>

        <div class="toggle-text">
            <span id="toggle-msg">Don't have an account?</span> 
            <a id="toggle-link">Sign Up</a>
        </div>
    </div>

    <script>
        let isSignUp = false;

        const authTitle = document.getElementById('auth-title');
        const authSubtitle = document.getElementById('auth-subtitle');
        const submitBtn = document.getElementById('submit-btn');
        const toggleMsg = document.getElementById('toggle-msg');
        const toggleLink = document.getElementById('toggle-link');
        const authForm = document.getElementById('auth-form');

        toggleLink.addEventListener('click', () => {
            isSignUp = !isSignUp;
            if(isSignUp) {
                authTitle.innerText = "Create an Account";
                authSubtitle.innerText = "Join EduAvatar and start learning faster";
                submitBtn.innerText = "Sign Up";
                toggleMsg.innerText = "Already have an account?";
                toggleLink.innerText = "Sign In";
            } else {
                authTitle.innerText = "Welcome Back";
                authSubtitle.innerText = "Sign in to continue to your dashboard";
                submitBtn.innerText = "Sign In";
                toggleMsg.innerText = "Don't have an account?";
                toggleLink.innerText = "Sign Up";
            }
        });

        authForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if(email && password) {
                // Simulate loading state
                submitBtn.innerText = "Authenticating...";
                submitBtn.style.opacity = "0.7";
                
                setTimeout(() => {
                    // Redirect to dashboard
                    window.location.href = '/dashboard.html';
                }, 1000); // 1 sec fake delay
            }
        });
    </script>
</body>
</html>
