services:
  - type: web
    name: eduavatar
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && python3 -m pip install -r requirements.txt || pip install -r requirements.txt || true
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: NVIDIA_API_KEY
        sync: false
      - key: MONGO_URI
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
